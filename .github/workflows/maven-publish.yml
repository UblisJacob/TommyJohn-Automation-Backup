name: CI-Docker

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17  # or 11/8 depending on your project

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and start Docker Compose services
        run: |
          docker compose -f docker-compose-hubNode.yml up -d

      - name: Wait for Selenium Grid services to be ready
        run: sleep 20  # Increase if Grid takes longer to start

      - name: Run Maven tests
        run: mvn test

      - name: Stop Docker Compose services
        run: |
          docker compose -f docker-compose-hubNode.yml down

      - name: Archive TestNG report
        uses: actions/upload-artifact@v4
        with:
          name: TestNG Report
          path: ./target/surefire-reports/emailable-report.html