name: Selenium Grid Tests

on:
  workflow_dispatch:

jobs:
  docker-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker is already installed on GitHub runners.
      # But we must ensure the daemon is running.
      - name: Start Docker daemon
        run: |
          sudo systemctl start docker
          docker --version

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start Selenium Grid
        run: |
          docker-compose -f docker-compose-hubNode.yml up -d
          docker ps

      - name: Wait for Selenium Hub
        run: |
          echo "Waiting for Selenium Hub..."
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep '"ready":true'; then
              echo "Hub Ready!"
              exit 0
            fi
            echo "Still starting... $i/30"
            sleep 2
          done
          exit 1

      - name: Build & Run Maven tests
        run: |
          sudo apt-get install -y maven
          mvn test -Dmaven.test.failure.ignore=true

      - name: Stop Selenium Grid
        if: always()
        run: docker-compose -f docker-compose-hubNode.yml down

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-report
          path: target/surefire-reports/
