name: CI-Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Start Selenium Grid
        run: docker compose -f docker-compose-hubNode.yml up -d

      - name: Wait for Selenium Hub to become ready
        run: |
          echo "Waiting for Selenium Hub..."
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q "\"ready\": true"; then
              echo "Hub is ready!"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done

      - name: Run Maven tests
        run: mvn -B test

      - name: Stop Selenium Grid
        run: docker compose -f docker-compose-hubNode.yml down

      - name: Upload TestNG report
        uses: actions/upload-artifact@v3
        with:
          name: TestNG Report
          path: target/surefire-reports/emailable-report.html
